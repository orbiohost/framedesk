# Runs Qwen3-ASR on an NVIDIA GPU (needs the NVIDIA Container Toolkit on the host):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  asr:
    build:
      context: ./asr
      args:
        WITH_CUDA: 'true'
    environment:
      ASR_DEVICE: cuda
      ASR_DTYPE: bfloat16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

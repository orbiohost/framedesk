# Serves the React build and proxies the API, so browser sees one origin (first-party cookies).
# TLS is terminated in front of this container (LiteSpeed/CyberPanel on the host).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Connection "";

  # Backup restore is one long upload.
  location ~ ^/api/workspaces/[^/]+/backups/restore {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://api:4000;
  }

  # Dictated notes: a voice recording of up to 25 MB, answered once Whisper is done.
  location ~ ^/api/workspaces/[^/]+/transcripts/dictation {
    client_max_body_size 26m;
    proxy_read_timeout 600s;
    proxy_pass http://api:4000;
  }

  # Moodboards: a canvas save with a lot of sketching, or the sketch layer sent to the AI.
  location ~ ^/api/workspaces/[^/]+/moodboards {
    client_max_body_size 8m;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_pass http://api:4000;
  }

  # API calls and backup downloads. Uploads and media go straight between the browser and S3.
  location /api/ {
    client_max_body_size 2m;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_pass http://api:4000;
  }

  # OAuth discovery for AI connectors (Claude, ChatGPT...): answered by the API.
  location ^~ /.well-known/oauth- {
    proxy_pass http://api:4000;
  }

  # Digital Asset Links: lets the Android app (android/) open the site full
  # screen, without a browser address bar. Static file from client/public.
  location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }

  # Android app download (landing page button).
  location /downloads/ {
    types { application/vnd.android.package-archive apk; }
    add_header Content-Disposition "attachment";
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Installable-app manifest.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # The app itself (pages and built files). API answers carry the API's own
  # security headers. nginx drops inherited add_header lines in a location
  # that sets any, so each location lists the full set.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Microphone: dictated notes. Camera: profile photos.
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(self)" always;
    try_files $uri /index.html;
  }

  # Compress the app's code and API answers (LiteSpeed in front passes them on).
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml application/manifest+json;
}

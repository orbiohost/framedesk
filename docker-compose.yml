# docker compose up -d --build
# App settings live in ./server/.env; the values below override it for the container.
services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      TZ: Asia/Kolkata
      # Host LiteSpeed -> nginx container -> API
      TRUST_PROXY: 2
      COOKIE_SECURE: 'true'
      CLIENT_URL: https://${DOMAIN:?Set DOMAIN in .env next to docker-compose.yml}
      # Files live in S3 (S3_* in server/.env); this volume only holds unfinished uploads.
      UPLOAD_STAGING_DIR: /data/upload-staging
      # Speech-to-text (transcripts, dictation). Remove both lines to turn it off.
      ASR_URL: http://asr:9000
      ASR_API_KEY: ${ASR_API_KEY:?Set ASR_API_KEY in .env next to docker-compose.yml}
      # Request cache + shared rate limits. The API keeps working (on MongoDB
      # alone) if Redis is down; remove the line to run without it.
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    volumes:
      - framedesk_data:/data

  # Cache only: nothing in it needs to survive a restart, so no disk persistence.
  # volatile-lru evicts only entries with a TTL (cache, rate-limit counters),
  # never the cache's invalidation counters. No ports: only the API reaches it.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: >-
      redis-server --save "" --appendonly no
      --maxmemory 128mb --maxmemory-policy volatile-lru

  # Self-hosted speech-to-text: Qwen3-ASR-1.7B (+ Qwen3-ForcedAligner-0.6B for
  # subtitle timings) on PyTorch. No ports: only the API reaches it.
  # On a CPU it needs about 10 GB of RAM in float32 (both models).
  asr:
    build: ./asr
    restart: unless-stopped
    environment:
      ASR_API_KEY: ${ASR_API_KEY}
      ASR_MODEL: ${ASR_MODEL:-Qwen/Qwen3-ASR-1.7B}
      # Empty = no word timings (lines get estimated times; ~2.5 GB less RAM).
      ASR_ALIGNER: ${ASR_ALIGNER-Qwen/Qwen3-ForcedAligner-0.6B}
      ASR_DEVICE: cpu
      # float32 is safe everywhere; bfloat16 halves RAM but is only fast on CPUs with AVX-512 BF16/AMX.
      ASR_DTYPE: ${ASR_DTYPE:-float32}
      # 0 = every core. It runs at low CPU priority, so the site stays fast meanwhile.
      ASR_CPU_THREADS: ${ASR_CPU_THREADS:-0}
      # ~30 s pieces decoded at once. 1 keeps the progress bar moving; higher uses more RAM.
      ASR_BATCH_SIZE: ${ASR_BATCH_SIZE:-1}
    # A hard cap so a long file can never starve the other apps on the box.
    mem_limit: ${ASR_MEM_LIMIT:-10g}
    # Downloads each file from a signed S3 link (and the models once), so it needs outbound internet access.
    volumes:
      # Downloaded model weights (~6 GB), kept across rebuilds.
      - asr_models:/models

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${HTTP_BIND:-127.0.0.1:8086}:80'

volumes:
  framedesk_data:
  asr_models:

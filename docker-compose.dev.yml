# Local development: runs only the Whisper container, next to `npm run dev`.
#   docker compose -f docker-compose.dev.yml up -d --build
# The API (on your machine) reaches it at http://localhost:9000; set WHISPER_URL
# and WHISPER_API_KEY in server/.env. It downloads files from signed S3 links.
name: framedesk-dev

services:
  whisper:
    build: ./whisper
    restart: unless-stopped
    environment:
      WHISPER_API_KEY: ${WHISPER_API_KEY:?Set WHISPER_API_KEY in .env next to this file}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER_DEVICE: cpu
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-0}
    ports:
      # Only this computer can reach it.
      - '127.0.0.1:9000:9000'
    volumes:
      - whisper_models:/models

volumes:
  whisper_models:

# docker compose up -d --build
# App settings live in ./server/.env; the values below override it for the container.
services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      TZ: Asia/Kolkata
      # Host LiteSpeed -> nginx container -> API
      TRUST_PROXY: 2
      COOKIE_SECURE: 'true'
      CLIENT_URL: https://${DOMAIN:?Set DOMAIN in .env next to docker-compose.yml}
      # Files live in S3 (S3_* in server/.env); this volume only holds unfinished uploads.
      UPLOAD_STAGING_DIR: /data/upload-staging
      # Speech-to-text (transcripts, dictation). Remove both lines to turn it off.
      WHISPER_URL: http://whisper:9000
      WHISPER_API_KEY: ${WHISPER_API_KEY:?Set WHISPER_API_KEY in .env next to docker-compose.yml}
      # Request cache + shared rate limits. The API keeps working (on MongoDB
      # alone) if Redis is down; remove the line to run without it.
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    volumes:
      - framedesk_data:/data

  # Cache only: nothing in it needs to survive a restart, so no disk persistence.
  # volatile-lru evicts only entries with a TTL (cache, rate-limit counters),
  # never the cache's invalidation counters. No ports: only the API reaches it.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: >-
      redis-server --save "" --appendonly no
      --maxmemory 128mb --maxmemory-policy volatile-lru

  # Free, self-hosted OpenAI Whisper (faster-whisper). No ports: only the API reaches it.
  whisper:
    build: ./whisper
    restart: unless-stopped
    environment:
      WHISPER_API_KEY: ${WHISPER_API_KEY}
      # large-v3-turbo is several times faster than large-v3 on a CPU with nearly
      # the same quality. Set WHISPER_MODEL=large-v3 for the last bit of accuracy.
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER_DEVICE: cpu
      # 0 = every core. Whisper runs at low CPU priority, so the site stays fast meanwhile.
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-0}
      # 1 = greedy decoding (fast on a CPU); 5 = beam search (slower, slightly more accurate).
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-1}
      # Pieces of a long file decoded at once. 0 = off (less memory, slower).
      WHISPER_BATCH_SIZE: ${WHISPER_BATCH_SIZE:-8}
    # Downloads each file from a signed S3 link, so it needs outbound internet access.
    volumes:
      # Downloaded model weights (~1.6 GB for large-v3-turbo), kept across rebuilds.
      - whisper_models:/models

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${HTTP_BIND:-127.0.0.1:8086}:80'

volumes:
  framedesk_data:
  whisper_models:

# Serves the React build and proxies the API, so browser sees one origin (first-party cookies).
# TLS is terminated in front of this container (LiteSpeed/CyberPanel on the host).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Connection "";

  # Resumable uploads: 50 MB tus chunks.
  location /api/uploads {
    client_max_body_size 60m;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_pass http://api:4000;
  }

  # Backup restore is one long upload.
  location ~ ^/api/workspaces/[^/]+/backups/restore {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://api:4000;
  }

  # Dictated notes: a voice recording of up to 25 MB, answered once Whisper is done.
  location ~ ^/api/workspaces/[^/]+/transcripts/dictation {
    client_max_body_size 26m;
    proxy_read_timeout 600s;
    proxy_pass http://api:4000;
  }

  # API calls and backup downloads. Media streams straight from S3 signed links.
  location /api/ {
    client_max_body_size 2m;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_pass http://api:4000;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
}
